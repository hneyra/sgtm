# Verificación del backend en cada pull request (CAL-01 §2).
#
# Un job por barrera, y no un único `./gradlew build`, a propósito: cuando algo se
# rompe, el nombre del check ya dice qué barrera cayó sin abrir el log. Las tres
# son bloqueantes; ninguna se salta a sí misma.
#
#   calidad      Spotless, Checkstyle y NullAway, más la compilación de todo módulo
#   arquitectura ArchUnit, escáner del código fuente y límites de Spring Modulith
#   aislamiento  Aislamiento multi-tenant: esquema y pool. Necesita Docker
name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# El backend no publica nada desde CI: solo lee el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior; en main no se cancela
# nada, porque ahí cada commit tiene que quedar verificado.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ADR-0001 fija Java 25. El job `calidad` verifica que este número siga siendo el
  # mismo que declara backend/gradle.properties.
  JAVA_VERSION: '25'

defaults:
  run:
    working-directory: backend

jobs:
  calidad:
    name: Calidad — formato, estilo y nulidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # gradle.properties permite construir con otra versión de Java para el
      # entorno que todavía no tiene el JDK 25; CI usa siempre la de ADR-0001. Si
      # alguien cambia la propiedad, esto falla y obliga a cambiar también aquí,
      # en vez de que CI verifique en silencio una versión distinta de la del
      # despliegue.
      - name: La versión de Java declarada es la que usa CI
        run: |
          declarada=$(sed -n 's/^sgtm\.java\.version=//p' gradle.properties)
          if [ "$declarada" != "$JAVA_VERSION" ]; then
            echo "::error file=backend/gradle.properties::gradle.properties declara Java $declarada y este workflow instala Java $JAVA_VERSION. Actualiza JAVA_VERSION en .github/workflows/backend.yml."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Que el wrapper del repositorio sea el distribuido por Gradle y no un
          # jar sustituido en un PR.
          validate-wrappers: true

      # `build -x test` deja fuera solo las pruebas: Spotless, Checkstyle y
      # NullAway sí corren, y sobre las fuentes de prueba también. Las pruebas son
      # de los otros dos jobs.
      - name: ./gradlew build -x test
        run: ./gradlew build -x test

      - name: Reportes de calidad
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: backend/**/build/reports/checkstyle/
          if-no-files-found: ignore
          retention-days: 7

  arquitectura:
    name: Arquitectura — ArchUnit, escáner y Modulith
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: ./gradlew verificarArquitectura
        run: ./gradlew verificarArquitectura

      - name: Reportes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-arquitectura
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  aislamiento:
    name: Aislamiento multi-tenant — esquema y pool
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # Sin motor de base de datos la prueba falla, no se salta (CAL-01 §2). Se
      # comprueba antes y se descarga la imagen aparte para que un runner sin
      # Docker o un registro caído se distingan de un fallo de aislamiento de
      # verdad, que es lo único que este job debería reportar en rojo.
      - name: Docker e imagen de PostgreSQL
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::Sin Docker no hay prueba de aislamiento. La prueba no se omite: se apunta a un PostgreSQL existente con -Dsgtm.pruebas.postgres.url (backend/README.md)."
            exit 1
          fi
          docker pull postgres:16-alpine

      - name: ./gradlew verificarAislamiento
        run: ./gradlew verificarAislamiento

      - name: Reportes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-aislamiento
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
