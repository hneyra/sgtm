# Verificacion del backend. Lo que este workflow ejecuta es exactamente lo que
# CLAUDE.md pide antes de un PR, sin atajos:
#
#   ./gradlew verificarAislamiento    aislamiento multi-tenant. Requiere Docker.
#   ./gradlew verificarArquitectura   ArchUnit, escaner de fuentes y Spring Modulith.
#   ./gradlew build                   compilacion, Spotless, Checkstyle y NullAway.
#
# Van en pasos separados a proposito, aunque `build` acabe ejecutando las mismas
# pruebas: cuando algo se rompe, el nombre del paso ya dice que barrera cayo.
#
# Las pruebas de persistencia NO se omiten sin Docker: fallan. Una verificacion
# bloqueante que se salta a si misma deja el build en verde sin haber verificado
# nada, que es peor que no tenerla. El runner de GitHub trae Docker.

name: Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la ejecucion anterior.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Verificaciones bloqueantes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # ADR-0001 fija Java 25. La propiedad `sgtm.java.version` existe para poder
      # construir en una maquina que todavia no lo tenga; aqui se usa el valor por
      # omision, que es el unico admitido. Y se comprueba en vez de suponerse: si
      # alguien cambiara la propiedad, CI verificaria en silencio una version de
      # Java distinta de la que se despliega.
      - name: La version de Java declarada es la que instala CI
        run: |
          declarada=$(sed -n 's/^sgtm\.java\.version=//p' gradle.properties)
          if [ "$declarada" != "25" ]; then
            echo "::error file=backend/gradle.properties::gradle.properties declara Java $declarada y este workflow instala Java 25. ADR-0001 fija 25; si de verdad cambia, cambia tambien .github/workflows/backend.yml."
            exit 1
          fi

      - name: Instalar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      # El wrapper descarga la distribucion de services.gradle.org, que devuelve
      # 502 de vez en cuando. Sin este paso, ese 502 aparece como un build rojo
      # indistinguible de un fallo real, y la reaccion natural —relanzar— acaba
      # normalizando el relanzamiento como respuesta a cualquier rojo.
      #
      # Se hace aparte y con reintentos para que el fallo de red tenga su propio
      # nombre. Una vez descargada queda en la cache, asi que los pasos de abajo
      # ya no vuelven a pedirla.
      - name: Descargar la distribucion de Gradle, con reintentos
        run: |
          for intento in 1 2 3 4; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "Intento $intento fallido; se reintenta en $((intento * 10))s"
            sleep $((intento * 10))
          done
          echo "No se pudo descargar la distribucion de Gradle tras cuatro intentos"
          exit 1

      # Por el mismo motivo que el paso anterior: sin esto, un runner sin Docker o
      # un registro caido salen en rojo como si fueran un fallo de aislamiento, y
      # el rojo que mas importa del proyecto es justo el que no puede confundirse
      # con otra cosa. Que la prueba no se salte sin Docker es lo que hace falta
      # comprobar antes; no despues.
      - name: Docker y la imagen de PostgreSQL
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::Sin Docker no hay prueba de aislamiento. La salida documentada es apuntar a un PostgreSQL existente con -Dsgtm.pruebas.postgres.url (backend/README.md); omitir la prueba no lo es."
            exit 1
          fi
          docker pull postgis/postgis:16-3.4-alpine

      - name: Aislamiento multi-tenant
        run: ./gradlew verificarAislamiento --no-daemon

      - name: Arquitectura, escaner de fuentes y limites de modulo
        run: ./gradlew verificarArquitectura --no-daemon

      - name: Build completo, con Spotless, Checkstyle y NullAway
        run: ./gradlew build --no-daemon

      - name: Publicar los informes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-prueba
          path: |
            backend/**/build/reports/tests/**
            backend/**/build/reports/checkstyle/**
          if-no-files-found: ignore
          retention-days: 7
