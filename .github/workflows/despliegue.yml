# Verificacion del despliegue.
#
# No comprueba que el compose este bien escrito: lo LEVANTA, y despues le hace
# preguntas al sistema en marcha. Un compose revisado a ojo se ve correcto hasta
# el dia del despliegue.
#
# Lo que pregunta, y por que cada cosa:
#
#   1. ¿Se aplicaron todas las migraciones del repositorio? Un `locations` mal
#      escrito, o un migrador que no se ejecuta, dejan la base a medias sin que
#      nada falle.
#   2. ¿Responde la sonda de vida, sin publicar detalles?
#   4. LA ESCALERA DE IDENTIDAD, peldano a peldano. Cada uno responde con su
#      codigo del catalogo, y el codigo es lo que hace la asercion precisa —dice
#      HASTA DONDE llego la peticion, no solo que fallo—:
#
#        sin token ................................ 401 NO_AUTENTICADO
#        con algo que no es un token .............. 401 NO_AUTENTICADO
#        con un token de otro emisor .............. 401 NO_AUTENTICADO
#        con token del realm, sin el claim ........ 403 SIN_MUNICIPALIDAD
#        con token del realm y con el claim ....... 403 SIN_PRIVILEGIO
#
#      El ultimo peldano es el que importa: SIN_PRIVILEGIO significa que el token
#      se valido, que el claim se leyo y que la peticion llego hasta el guardia de
#      acceso. Que no tenga permisos es correcto —no hay municipalidad ni usuario
#      en las tablas de la aplicacion todavia, y eso es #120—.
#   5. ¿Se atiende alguna otra ruta? La respuesta a todas es que no.
#   6. ¿Se sirve la interfaz, y su paquete lleva el emisor? Vite lo resuelve al
#      compilar: si no esta dentro del paquete, la pantalla de acceso no lleva a
#      ninguna parte.
#   7. ¿Puede la aplicacion ejecutar DDL? Esta es la que da valor al resto.
#
# COMO SE DEMUESTRA QUE PUEDEN FALLAR:
#
#   - La 7: se cambia en el compose el `SGTM_DB_USUARIO: sgtm_app` de la
#     aplicacion por `sgtm_owner`, con su clave, y este trabajo se pone rojo. Lee
#     las credenciales del contenedor que esta corriendo, no las que el compose
#     deberia tener.
#   - La 4: se quita el mapeador `municipalidad-id` del realm y el ultimo peldano
#     pasa de SIN_PRIVILEGIO a SIN_MUNICIPALIDAD; se apunta `issuer-uri` al realm
#     master y el peldano del emisor ajeno pasa a valer; se quita el
#     `oauth2ResourceServer` de SeguridadWeb y los cinco peldanos cambian a la vez.

name: Despliegue

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "despliegue/**"
      - ".github/workflows/despliegue.yml"
  workflow_dispatch:

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  levantar:
    name: La marcha blanca se levanta, se entra con token, y la aplicacion no puede hacer DDL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: despliegue

    steps:
      - uses: actions/checkout@v4

      # Claves distintas en cada corrida y en cada rol. Si las tres fueran la
      # misma, la comprobacion 4 podria pasar por el motivo equivocado.
      - name: Generar el .env con claves efimeras
        run: |
          {
            echo "SGTM_CLAVE_SUPERUSUARIO=$(openssl rand -hex 24)"
            echo "SGTM_CLAVE_OWNER=$(openssl rand -hex 24)"
            echo "SGTM_CLAVE_APP=$(openssl rand -hex 24)"
            echo "SGTM_CLAVE_KEYCLOAK=$(openssl rand -hex 24)"
            echo "SGTM_CLAVE_VERIFICACION=$(openssl rand -hex 24)"
          } > .env

      # Se espera a `aplicacion` y no a todo: `migraciones` corre y termina, y un
      # contenedor que sale con exito no es un contenedor sano. Sus dependencias
      # arrastran a los otros dos igualmente.
      - name: Levantar la instalacion completa
        run: docker compose up --build --detach --wait aplicacion interfaz

      - name: 1 · Todas las migraciones del repositorio estan aplicadas
        run: |
          set -euo pipefail
          source .env
          enElRepositorio=$(find ../backend/sgtm-esquema/src/main/resources/db/migration \
            -name 'V*.sql' | wc -l)
          aplicadas=$(docker compose exec -T -e PGPASSWORD="$SGTM_CLAVE_SUPERUSUARIO" base \
            psql --username postgres --dbname sgtm --tuples-only --no-align \
            --command "SELECT count(*) FROM flyway_schema_history WHERE success" | tr -d '\r')
          echo "En el repositorio: $enElRepositorio. Aplicadas: $aplicadas."
          test "$enElRepositorio" -eq "$aplicadas"

      - name: 2 · La sonda de vida responde, y no cuenta lo que no debe
        run: |
          set -euo pipefail
          respuesta=$(curl --fail --silent http://localhost:8080/actuator/health)
          echo "$respuesta"
          echo "$respuesta" | grep -q '"status":"UP"'
          # show-details: never. Si el cuerpo trae componentes, la sonda esta
          # publicando la configuracion delante de la cadena de seguridad.
          if echo "$respuesta" | grep -q '"components"'; then
            echo "La sonda publica detalles: revisar management.endpoint.health.show-details"
            exit 1
          fi

      - name: Esperar a que Keycloak responda
        run: |
          set -euo pipefail
          # La aplicacion no espera a Keycloak —no lo necesita para arrancar— pero
          # quien va a pedir un token si. Se espera desde el runner, que tiene curl.
          for intento in $(seq 1 60); do
            if curl --fail --silent http://localhost:8180/realms/sgtm/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak listo, y el realm sgtm importado."
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak no respondio en cinco minutos"
          docker compose logs --no-color --tail 100 identidad
          exit 1

      - name: 3 · Los dos usuarios de verificacion
        run: |
          set -euo pipefail
          source .env
          export SGTM_CLAVE_KEYCLOAK
          # Uno con municipalidad y otro sin ella. El segundo existe para una sola
          # cosa: comprobar que un token valido pero sin el claim no llega a ningun
          # controlador. No se puede comprobar sin tenerlo.
          ./identidad/crear-usuario.sh verificacion "$SGTM_CLAVE_VERIFICACION" 1
          ./identidad/crear-usuario.sh sin-municipalidad "$SGTM_CLAVE_VERIFICACION"

      - name: 4 · La escalera de identidad, peldano a peldano
        run: |
          set -euo pipefail
          source .env
          RUTA=http://localhost:8080/api/v1/catastro/vias
          KC=http://localhost:8180

          # Si el token no sale, lo que interesa es POR QUE, y eso lo dice Keycloak
          # en el cuerpo. Sin este cuidado, el fallo aparece como un rastro de
          # Python sobre un JSON vacio y hay que ir a los registros del contenedor
          # para enterarse de que, por ejemplo, al usuario le faltaba el apellido.
          token() {
            local respuesta acceso
            respuesta=$(curl --silent --request POST \
              "$KC/realms/$1/protocol/openid-connect/token" \
              --data "grant_type=password&client_id=$2&username=$3&password=$4")
            acceso=$(printf '%s' "$respuesta" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))' \
              2>/dev/null || true)
            if [ -z "$acceso" ]; then
              echo "Keycloak no emitio token para '$3' en el realm '$1':" >&2
              printf '%s\n' "$respuesta" >&2
              return 1
            fi
            printf '%s' "$acceso"
          }

          # Devuelve "codigo_http CODIGO_DEL_CATALOGO", que es lo que hace precisa
          # cada asercion: distingue «no se autentico» de «se autentico y no tiene
          # municipalidad» de «tiene municipalidad y le falta el privilegio».
          intento() {
            local cabecera=("$@")
            local cuerpo estado
            cuerpo=$(curl --silent --output /tmp/cuerpo --write-out '%{http_code}' \
              "${cabecera[@]}" "$RUTA")
            estado=$cuerpo
            echo "$estado $(python3 -c 'import json;print(json.load(open("/tmp/cuerpo")).get("codigo","(sin codigo)"))' 2>/dev/null || echo '(sin cuerpo json)')"
          }

          echo "--- sin token"
          test "$(intento)" = "401 NO_AUTENTICADO"

          echo "--- con un token que no es un token"
          test "$(intento --header 'Authorization: Bearer esto-no-es-un-token')" = "401 NO_AUTENTICADO"

          echo "--- con un token de OTRO emisor: el realm master del mismo Keycloak"
          ajeno=$(token master admin-cli "${SGTM_KEYCLOAK_ADMIN:-admin}" "$SGTM_CLAVE_KEYCLOAK")
          test "$(intento --header "Authorization: Bearer $ajeno")" = "401 NO_AUTENTICADO"

          echo "--- con un token del realm correcto pero SIN el claim municipalidad_id"
          sinClaim=$(token sgtm sgtm-verificacion sin-municipalidad "$SGTM_CLAVE_VERIFICACION")
          test "$(intento --header "Authorization: Bearer $sinClaim")" = "403 SIN_MUNICIPALIDAD"

          echo "--- con un token completo: pasa la cadena y llega al guardia de acceso"
          conClaim=$(token sgtm sgtm-verificacion verificacion "$SGTM_CLAVE_VERIFICACION")
          # SIN_PRIVILEGIO y no SIN_MUNICIPALIDAD: el token se valido y el claim se
          # leyo. Que no tenga permisos es correcto —todavia no hay municipalidad ni
          # usuario en las tablas de la aplicacion, y eso es #120—; lo que se verifica
          # aqui es hasta donde llego la peticion, no que devuelva datos.
          test "$(intento --header "Authorization: Bearer $conClaim")" = "403 SIN_PRIVILEGIO"

      - name: 5 · Ninguna otra ruta se atiende
        run: |
          set -euo pipefail
          for ruta in /actuator/env /actuator/beans /; do
            codigo=$(curl --output /dev/null --silent --write-out '%{http_code}' \
              "http://localhost:8080$ruta")
            echo "$ruta -> $codigo"
            case "$codigo" in
              401|403|404) ;;
              *) echo "  $ruta respondio $codigo sin token"; exit 1 ;;
            esac
          done

      - name: 6 · La interfaz se sirve, y apunta al emisor configurado
        run: |
          set -euo pipefail
          curl --fail --silent http://localhost:8081/ | grep -qi "<div id=\"raiz\"\|<div id=\"root\"\|<body" \
            || { echo "La interfaz no devolvio una pagina"; exit 1; }
          # El emisor entra al compilar, asi que tiene que estar DENTRO del paquete.
          # Si no esta, la imagen se construyo sin la configuracion de identidad y la
          # pantalla de acceso no llevaria a ninguna parte.
          if ! docker compose exec -T interfaz grep -rq "realms/sgtm/protocol/openid-connect/token" /usr/share/nginx/html/assets; then
            echo "El paquete de la interfaz no lleva el emisor configurado"
            exit 1
          fi

      - name: 7 · La aplicacion no puede ejecutar DDL
        run: |
          set -euo pipefail
          # Las credenciales salen del contenedor en marcha, no del compose: se
          # comprueba lo que el proceso tiene de verdad.
          usuario=$(docker compose exec -T aplicacion printenv SGTM_DB_USUARIO | tr -d '\r')
          clave=$(docker compose exec -T aplicacion printenv SGTM_DB_CLAVE | tr -d '\r')
          echo "La aplicacion se conecta como: $usuario"

          if docker compose exec -T -e PGPASSWORD="$clave" base \
               psql --username "$usuario" --dbname sgtm --quiet \
               --command 'CREATE TABLE intento_de_ddl (id int)' 2>&1
          then
            echo "FALLO: las credenciales de la aplicacion pueden crear tablas."
            echo "Un proceso expuesto en HTTP con DDL sobre el padron de todas las"
            echo "municipalidades es exactamente lo que ARQ-03 §4 excluye."
            exit 1
          fi
          echo "Correcto: el DDL se rechaza con las credenciales de la aplicacion."

      # `--tail 25` y no 200: con cinco servicios, doscientas lineas cada uno son mil
      # lineas que entierran la salida del paso que fallo, que es justo lo que hay
      # que leer. Lo aprendi buscando un error de kcadm a traves de mil lineas de
      # arranque de PostgreSQL.
      - name: Ultimas lineas de cada contenedor, si algo fallo
        if: failure()
        run: docker compose logs --no-color --tail 25

      - name: Apagar
        if: always()
        run: docker compose down --volumes
