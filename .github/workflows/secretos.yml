# Escaneo de secretos sobre TODO el repositorio (issue #154, INF-06).
#
# Deliberadamente sin filtro de rutas: un secreto puede colarse en cualquier archivo, no
# solo en `infra/`, y el criterio de aceptacion dice "todo el repositorio". Los otros
# workflows recortan por carpeta porque verifican comportamiento de esa carpeta; este
# verifica una propiedad global.
#
# Dos trabajos:
#
#   1. `la-muestra-se-detecta` — apunta gitleaks DIRECTO a
#      `infra/verificaciones/secretos/muestras/`, sin el `.gitleaks.toml` del
#      repositorio (que la excluye). Tiene que encontrar el secreto de mentira que hay
#      ahi. Si algun dia no lo encuentra, el trabajo de abajo no estaria protegiendo
#      nada — es la misma logica que exige el resto de "muestras" del repositorio.
#   2. `el-repositorio-esta-limpio` — gitleaks contra el arbol de trabajo completo, con
#      el `.gitleaks.toml` del repositorio (que excluye solo esa muestra). Tiene que
#      salir sin hallazgos.
#
# `--no-git`: escanea el arbol de trabajo tal como esta en este commit, no el historial
# completo. Es una eleccion de alcance: cubre "ningun secreto esta en el repositorio
# ahora", no arqueologia de commits viejos — que para un monorepo de este tamano seria
# un escaneo mucho mas caro por una garantia que el criterio de aceptacion no pide.
name: Secretos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fijada, no "latest": una version movil convierte cualquier corrida en una
  # actualizacion no planificada del escaneo, con la misma logica que INF-01 §5 aplica
  # a las imagenes de contenedor.
  GITLEAKS_VERSION: 8.30.1

jobs:
  la-muestra-se-detecta:
    name: La muestra de mentira SE detecta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/instalar-gitleaks

      - name: gitleaks contra la muestra, sin la exclusion del repositorio
        run: |
          set -euo pipefail
          if gitleaks detect --no-git \
               --source infra/verificaciones/secretos/muestras \
               --redact; then
            echo "::error::gitleaks NO encontro la clave de mentira. El escaneo del" \
                 "repositorio completo no estaria protegiendo nada: revisa" \
                 "infra/verificaciones/secretos/muestras/clave-de-mentira.env y las" \
                 "reglas de gitleaks."
            exit 1
          fi
          echo "Correcto: gitleaks encontro la clave de mentira."

  el-repositorio-esta-limpio:
    name: El repositorio no tiene secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/instalar-gitleaks

      - name: gitleaks contra el repositorio, con .gitleaks.toml
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact
