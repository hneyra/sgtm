# Verificación de la documentación que se comprueba sola.
#
# Son tres, y las tres comprueban en las dos direcciones:
#
#   1. el **mapa normativo** de NEG-02 §2 — qué norma fija cada dato que falta,
#      qué parte de D-02 lo bloquea y qué issues lo esperan— contra el etiquetado
#      real del tablero;
#   2. los **valores normativos transcritos** (E-3, #200) — que cada archivo lleve
#      norma, artículo, fecha de publicación y **dos firmas distintas**, que cierre
#      filas del mapa que existen y que nadie más cierra, y que ninguna cifra haya
#      acabado cargada en una migración: cargar depende de D-13, no de E-3.
#   3. el **contrato de la API** (#312) — que `sgtm-v1.yaml` sea todavía lo que su
#      generador produce. Es el gemelo de «el catálogo generado cuadra con el
#      prototipo» del flujo de frontend, y existe porque el contrato dejó de
#      poder reproducirse sin que nada se pusiera rojo: seguía siendo válido, el
#      backend lo cumplía y el frontend generaba sus tipos de él, y aun así
#      regenerarlo borraba 519 líneas y dos operaciones enteras.
#
# La segunda pasa en verde con el directorio vacío, y debe hacerlo: la barrera
# llega antes que la transcripción. Por eso corre además contra sus muestras, que
# es lo que distingue «no hay nada que rechazar» de «no rechaza nada».
#
# Va en su propio flujo y no dentro del de frontend porque no necesita `yarn`
# ni el espacio de trabajo: es Node pelado sobre archivos de `docs/`.
name: Documentación

on:
  pull_request:
    paths: &rutas
      - 'docs/10-negocio/**'
      - '.github/workflows/documentacion.yml'
      # La comprobación de valores normativos LEE las migraciones, para que una
      # cifra cargada por SQL no se escape del filtro de rutas.
      - 'backend/sgtm-esquema/src/main/resources/db/migration/**'
      # El contrato y el prototipo del que se deriva: son las DOS entradas del
      # generador de OpenAPI, y tocar cualquiera de ellas sin la otra es
      # exactamente lo que la comprobación tiene que ver.
      - 'docs/50-api/**'
      - 'design/sgtm-data-*.js'
  push:
    branches: [main]
    paths: *rutas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Documentación que se comprueba sola
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: El mapa normativo y el tablero dicen lo mismo
        run: node docs/10-negocio/verificar-mapa-normativo.mjs

      - name: Las prohibiciones de los valores normativos muerden
        run: node docs/10-negocio/verificar-las-muestras-de-valores.mjs

      - name: Los valores normativos transcritos están en regla
        run: node docs/10-negocio/verificar-valores-normativos.mjs

      # No escribe el archivo: lo regenera en memoria y exige que sea el mismo.
      # Se comprobó que muerde, en las dos direcciones: retocando un `summary`
      # del YAML a mano, borrando de él la operación `permisos_de_la_sesion`
      # entera, y quitándole al generador la descripción de un parámetro de ruta.
      # Las tres lo ponen rojo, con la línea y las dos versiones.
      - name: El contrato de la API es el que su generador produce
        run: node docs/50-api/generar-openapi.mjs --comprobar
