# Verificación del frontend.
#
# Es lo que hay que pasar antes de un PR, y lo que hay que pasar aquí es lo
# mismo: tipos, compilación, y las tres comprobaciones que sujetan las reglas
# por las que esta interfaz existe.
#
# <h2>Las tres, y por qué son éstas</h2>
#
#   1. `mirar` — las 65 pantallas se dibujan, sin errores de consola y sin
#      cuerpo vacío. Es la red más ancha y la más barata.
#   2. `sin-red` — con TODAS las peticiones a `/api/v1` abortadas, ninguna
#      pantalla enseña una cifra. Es la regla que gobierna esta interfaz: lo que
#      el backend no sostiene sale «—» con su motivo, nunca la cifra del
#      prototipo. Y mide el momento en que esa regla se rompe sin que nadie lo
#      vea, porque con datos delante la pantalla parece correcta siempre.
#   3. `paleta` — la paleta de comandos se opera sólo con el teclado. Está aquí
#      porque **ya se rompió una vez**: el frontend anterior lo tenía, se perdió
#      al reescribir, y nada lo notó.
#
# <h2>Por qué no hace falta backend</h2>
#
# Las tres corren contra `vite preview` sin token y sin servidor: `sin-red`
# aborta las peticiones a propósito, y las otras dos no dependen de ninguna.
# Eso las hace deterministas aquí, que es lo que un flujo bloqueante necesita.
# Lo que sí exige backend —`flujos.mjs`, que opera cada botón contra el servidor
# de verdad— se corre a mano contra el entorno levantado, y no se finge aquí:
# una verificación que en CI mide otra cosa deja de decir lo que dice.
#
# El contrato (`docs/50-api/openapi/sgtm-v1.yaml`) entra en los caminos que
# disparan este flujo porque los tipos de la API salen de él.
#
# El backend no está aquí: sus verificaciones bloqueantes necesitan Docker y un
# PostgreSQL de verdad (`./gradlew verificarAislamiento`), y montar eso es una
# decisión propia que este flujo no toma por su cuenta.
name: Frontend

on:
  pull_request:
    paths:
      ['frontend/**', 'docs/50-api/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths:
      ['frontend/**', 'docs/50-api/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Tipos
        run: yarn verificar

      - name: Compilar para producción
        run: yarn build

  navegador:
    name: Las 65 pantallas, en un navegador de verdad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Instalar Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Compilar y servir
        run: |
          yarn build
          npx vite preview --port 5210 --strictPort &
          # Sin `wait-on`: es una dependencia mas que descargar para hacer lo
          # que hacen tres lineas, y en un flujo bloqueante cada descarga es
          # una forma nueva de ponerse rojo por algo que no se esta midiendo.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5210/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5210/

      - name: Las 65 pantallas se dibujan
        run: SGTM_BASE=http://localhost:5210 node verificaciones/mirar.mjs

      - name: Con la red cortada, ninguna enseña una cifra
        run: SGTM_BASE=http://localhost:5210 node verificaciones/sin-red.mjs

      - name: La paleta se opera con el teclado
        run: SGTM_BASE=http://localhost:5210 node verificaciones/paleta.mjs

      - name: Publicar las capturas de lo que fallara
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-del-navegador
          path: frontend/.capturas/
          retention-days: 7
