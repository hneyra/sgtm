# Verificación del frontend.
#
# Es lo que hay que pasar antes de un PR, y lo que hay que pasar aquí es lo
# mismo: tipos, compilación, y las tres comprobaciones que sujetan las reglas
# por las que esta interfaz existe.
#
# <h2>Las tres, y por qué son éstas</h2>
#
#   1. `mirar` — las 65 pantallas se dibujan, sin errores de consola y sin
#      cuerpo vacío. Es la red más ancha y la más barata.
#   2. `sin-red` — con TODAS las peticiones a `/api/v1` abortadas, ninguna
#      pantalla enseña una cifra. Es la regla que gobierna esta interfaz: lo que
#      el backend no sostiene sale «—» con su motivo, nunca la cifra del
#      prototipo. Y mide el momento en que esa regla se rompe sin que nadie lo
#      vea, porque con datos delante la pantalla parece correcta siempre.
#   3. `paleta` — la paleta de comandos se opera sólo con el teclado. Está aquí
#      porque **ya se rompió una vez**: el frontend anterior lo tenía, se perdió
#      al reescribir, y nada lo notó.
#
# <h2>Por qué no hace falta backend</h2>
#
# Las tres corren contra `vite preview` sin token y sin servidor: `sin-red`
# aborta las peticiones a propósito, y las otras dos no dependen de ninguna.
# Eso las hace deterministas aquí, que es lo que un flujo bloqueante necesita.
# Lo que sí exige backend —`flujos.mjs`, que opera cada botón contra el servidor
# de verdad— se corre a mano contra el entorno levantado, y no se finge aquí:
# una verificación que en CI mide otra cosa deja de decir lo que dice.
#
# El contrato (`docs/50-api/openapi/sgtm-v1.yaml`) entra en los caminos que
# disparan este flujo porque los tipos de la API salen de él.
#
# El backend no está aquí: sus verificaciones bloqueantes necesitan Docker y un
# PostgreSQL de verdad (`./gradlew verificarAislamiento`), y montar eso es una
# decisión propia que este flujo no toma por su cuenta.
name: Frontend

on:
  pull_request:
    paths:
      ['frontend/**', 'docs/50-api/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths:
      ['frontend/**', 'docs/50-api/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # La version sale de `frontend/.nvmrc` y no de un literal aqui: con el
      # literal, CI y quien clona el repositorio son dos numeros que pueden
      # separarse sin que nada lo diga, y separarse es lo que hacen. Asi la
      # incoherencia no se comprueba: no se puede escribir (#439).
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Tipos
        run: yarn verificar

      # No necesita navegador: compila los dos modulos del arbol y los compara.
      - name: Los vocabularios cerrados cuadran con lo que la pantalla ofrece
        run: yarn vocabularios

      - name: Compilar para producción
        run: yarn build

  navegador:
    name: Las 65 pantallas, en un navegador de verdad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # La version sale de `frontend/.nvmrc` y no de un literal aqui: con el
      # literal, CI y quien clona el repositorio son dos numeros que pueden
      # separarse sin que nada lo diga, y separarse es lo que hacen. Asi la
      # incoherencia no se comprueba: no se puede escribir (#439).
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Instalar Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Compilar y servir
        run: |
          yarn build
          npx vite preview --port 5210 --strictPort &
          # Sin `wait-on`: es una dependencia mas que descargar para hacer lo
          # que hacen tres lineas, y en un flujo bloqueante cada descarga es
          # una forma nueva de ponerse rojo por algo que no se esta midiendo.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5210/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5210/

      - name: Las 65 pantallas se dibujan
        run: SGTM_BASE=http://localhost:5210 node verificaciones/mirar.mjs

      - name: Con la red cortada, ninguna enseña una cifra
        run: SGTM_BASE=http://localhost:5210 node verificaciones/sin-red.mjs

      - name: La paleta se opera con el teclado
        run: SGTM_BASE=http://localhost:5210 node verificaciones/paleta.mjs

      # Los seis que seguian: declarados en `package.json` y sin correrlos nadie,
      # que es el defecto que #435 encontro con `verificar-rotacion.sh` y #188
      # con `verificar-cuadros.mjs` — una verificacion escrita que nunca se
      # ejecuta no protege nada. Los seis pasan contra la vista previa sola, sin
      # backend y sin token: medido.
      #
      # `flujos` NO entra, y se dice por que: exige `SGTM_TOKEN` y un backend
      # vivo —«Falta SGTM_TOKEN: sin sesion no hay flujo que validar»—, ninguno
      # de los dos existe en este trabajo. Meterlo aqui lo pondria rojo por un
      # motivo que no es el que mide, que es peor que no correrlo. Su sitio es un
      # trabajo con el compose levantado, y no lo hay todavia.
      - name: Ningun boton apagado se queda mudo
        run: SGTM_BASE=http://localhost:5210 node verificaciones/impedimentos.mjs

      - name: Ninguna hoja lleva el shell delante ni sale en blanco
        run: SGTM_BASE=http://localhost:5210 node verificaciones/impresion.mjs

      - name: Los vocabularios son los del backend
        run: SGTM_BASE=http://localhost:5210 node verificaciones/vocabularios.mjs

      - name: Cada error se clasifica como lo que es
        run: SGTM_BASE=http://localhost:5210 node verificaciones/errores.mjs

      - name: La ficha catastral dice lo que el backend publica
        run: SGTM_BASE=http://localhost:5210 node verificaciones/ficha-catastral.mjs

      # Fabrica la respuesta —todas las lecturas en 500—, asi que no necesita
      # backend ni token: con el backend delante los catalogos vienen llenos y
      # un desplegable que se queda mudo no se ve nunca (#718).
      - name: Ningun desplegable se queda sin nada que ofrecer y mudo
        run: SGTM_BASE=http://localhost:5210 node verificaciones/desplegables.mjs

      # Este no abre navegador —mide dos funciones puras— y se reejecuta solo
      # con `TZ=America/Lima`: en UTC los casos pasan con el defecto dentro.
      - name: La fecha sin zona no se convierte, y el instante si
        run: node verificaciones/fechas.mjs

      # Tampoco abre navegador. Va DESPUES del install a proposito: si `.nvmrc` y
      # `engines` se desincronizan, yarn ya habra fallado antes con el mensaje
      # que nombra las dos versiones, y esto solo tiene que cazar el caso en que
      # la version instalada las cumple y aun asi no es la que vite admite.
      - name: La version de Node dice lo mismo en los dos sitios
        run: node verificaciones/node.mjs

      - name: Publicar las capturas de lo que fallara
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-del-navegador
          path: frontend/.capturas/
          retention-days: 7
