# Instala el binario de gitleaks en el PATH del runner (issue #154).
#
# No via `gitleaks/gitleaks-action`: esa accion corre el escaneo ENTERO con su propia
# configuracion como su unico modo de uso — no deja un binario reutilizable en el PATH
# para que dos trabajos distintos lo llamen con argumentos diferentes (la muestra sola,
# y el repositorio con `.gitleaks.toml`). Descargar el binario directamente es lo que
# permite correr gitleaks dos veces, con dos alcances distintos, sin instalarlo dos
# veces.
name: Instalar gitleaks
description: Descarga el binario de gitleaks fijado en GITLEAKS_VERSION y lo deja en el PATH
runs:
  using: composite
  steps:
    - name: Descargar y verificar
      shell: bash
      run: |
        set -euo pipefail
        version="${GITLEAKS_VERSION:?falta GITLEAKS_VERSION en el workflow que llama a esta accion}"
        archivo="gitleaks_${version}_linux_x64.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archivo}"

        curl --fail --silent --show-error --location --output "$archivo" "$url"
        curl --fail --silent --show-error --location --output checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt"

        # Solo la linea de nuestro archivo: el resto del checksums.txt trae binarios de
        # otras plataformas que no descargamos y que `sha256sum -c` no encontraria.
        grep " ${archivo}\$" checksums.txt > checksum-esperado.txt
        sha256sum -c checksum-esperado.txt

        tar -xzf "$archivo" gitleaks
        chmod +x gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
        gitleaks version
