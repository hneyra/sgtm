# La interfaz y el reenvio a la API, en el mismo origen.
#
# Que `/api/v1` se sirva desde aqui no es comodidad: es lo que hace que el
# navegador nunca hable con el backend directamente, y por tanto que no haya
# CORS que configurar ni un segundo origen que autorizar en Keycloak. Una
# configuracion de CORS permisiva es de las cosas que se ponen «temporalmente»
# para salir del paso y se quedan.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion resuelve sus rutas en el navegador: cualquier ruta que no sea
    # un archivo devuelve index.html. Sin esto, recargar la pagina en
    # /catastro/fichas da un 404 de nginx en vez de la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El portal del contribuyente es OTRA aplicacion —su propio paquete, sin el
    # shell ni el catalogo de navegacion (#298, ADR-0016 §3)— servida en el
    # MISMO origen. Que comparta origen no es comodidad: es lo que hace que
    # `/api/v1` siga siendo del propio origen y que no haya un segundo origen que
    # autorizar en Keycloak.
    #
    # Su `index.html` es el suyo, no el del back-office: sin esta regla,
    # cualquier ruta bajo /portal/ caeria en el `try_files` de arriba y el
    # ciudadano recibiria la aplicacion de ventanilla.
    location /portal/ {
        try_files $uri $uri/ /portal/index.html;
    }

    location /api/v1/ {
        proxy_pass http://aplicacion:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con huella en el nombre no cambian nunca; index.html si.
    #
    # **Las dos aplicaciones, en una sola regla cada cosa** (#298). Con el prefijo
    # `location /assets/` y la coincidencia exacta `location = /index.html` que
    # habia aqui, lo del portal —`/portal/assets/…` y `/portal/index.html`— no
    # entraba en ninguna de las dos: el prefijo no cubre `/portal/assets/` y la
    # exacta solo cubre esa ruta literal. El ciudadano se llevaba el paquete del
    # portal **sin politica de cache**, que es lo peor de los dos mundos: el
    # navegador decide por su cuenta, asi que unas veces vuelve a descargar
    # activos con huella que no cambian nunca —desde un telefono, con la red que
    # haya— y otras se queda con un `index.html` viejo que apunta a activos que
    # ya no existen.
    #
    # Se escriben como expresion regular, y el orden de precedencia de nginx lo
    # permite: las regex se evaluan **despues** de la coincidencia exacta y de
    # los prefijos, pero **ganan** a un prefijo que no lleve `^~`. De modo que
    # `/assets/x.js` y `/index.html` siguen recibiendo exactamente lo que
    # recibian, `location /portal/` sigue sirviendo su `try_files` para todo lo
    # demas bajo `/portal/`, y `/api/v1/` no las toca.
    location ~ ^/(portal/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(portal/)?index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
