          required: true
          schema: { type: string }
        - name: fecha
          in: query
          required: false
          description: "Ficha vigente a esta fecha. Sin ella, la que rige hoy"
          schema: { type: string }
          example: "2026-08-20"
        - name: historico
          in: query
          required: false
          description: "Trae todas las versiones de la ficha, no solo la vigente"
          schema: { type: string }
          example: "true"
        - name: codigoDeRefCatastral
          in: query
          required: false
          description: "Filtro «Código de Ref. Catastral» de la pantalla"
          schema: { type: string }
        - name: codContribuyenteRentas
          in: query
          required: false
          description: "Filtro «Cod. Contribuyente Rentas» de la pantalla"
          schema: { type: string }
        - name: nroFicha
          in: query
          required: false
          description: "Filtro «Nro. Ficha» de la pantalla"
          schema: { type: string }
        - name: uso
          in: query
          required: false
          description: "Filtro «Uso» de la pantalla"
          schema: { type: string }
        - name: pagina
          in: query
          required: false
          description: "Pagina que se pide, contada desde 0"
          schema: { type: string }
          example: "0"
        - name: tamano
          in: query
          required: false
          description: "Filas por pagina"
          schema: { type: string }
          example: "20"
        - name: ordenarPor
          in: query
          required: false
          description: "Campo por el que se ordena, en camelCase"
          schema: { type: string }
        - name: direccion
          in: query
          required: false
          description: "ASCENDENTE | DESCENDENTE"
          schema: { type: string }
          example: "ASCENDENTE"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/urbana":
    post:
      operationId: registrar_ficha_urbana
      summary: "Alta de ficha urbana individual"
      description: "Inscribe la primera versión de la ficha urbana individual (RF-001) de un predio, y da de alta el predio en el mismo acto si todavía no existe. El cuerpo lleva el código de referencia catastral, la ubicación del predio, los datos de la ficha —áreas y categorías, ningún importe—, su titularidad inicial si ya se conoce, y la observación del usuario, obligatoria (RNF-052). Si el predio ya tiene ficha de ese tipo, es 409: lo que toca entonces es actualizarla."
      tags: ["Catastro"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
