components:
  securitySchemes:
    tokenDeAcceso:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token OIDC validado. Debe traer el claim `municipalidad_id`; sin el, la
        peticion recibe 403 y no llega al controlador (ADR-0005, RNF-032).
  schemas:
    Importe:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
      description: |
        Decimal exacto como cadena. Nunca numero JSON: el `number` de
        JavaScript es binario de doble precision y pierde centimos (RNF-055).
      example: "1234.50"
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string, example: "DEUDA_YA_CANCELADA" }
        mensaje: { type: string, description: "En castellano; se muestra al usuario" }
        detalles: { type: array, items: { type: string } }
  responses:
    SinMunicipalidad:
      description: |
        El token no identifica una municipalidad. No hay valor por omision ni
        modo sin municipalidad.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ErrorDeValidacion:
      description: La peticion no cumple una regla de negocio
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
