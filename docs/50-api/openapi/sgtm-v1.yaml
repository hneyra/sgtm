# ARCHIVO GENERADO — no editar a mano.
# Origen: los `endpoint` de SGTM-design/sgtm-data-{1..5}.js.
# Regenerar con: node docs/50-api/generar-openapi.mjs
#
# Es el contrato PROPUESTO: define verbo, ruta y parametros de las 134
# operaciones que la interfaz espera. Los esquemas de cuerpo y respuesta se
# escriben cuando se implementa cada operacion.
openapi: 3.1.0
info:
  title: SGTM — Sistema de Gestion Tributaria Municipal
  version: 1.0.0-borrador
  description: |
    Contrato de la API del SGTM, derivado de las pantallas del prototipo de
    interfaz. Una operacion por opcion del menu.

    El identificador de municipalidad NO viaja en ninguna ruta, parametro ni
    cuerpo: sale del claim `municipalidad_id` del token validado (ADR-0005).
    Una peticion que lo mande por otro camino no lo consigue.

    Los importes son cadenas decimales, nunca numeros de coma flotante
    (RNF-055), y toda cifra de deuda indica a que fecha esta actualizada
    (RNF-075).
servers:
  - url: /api/v1
    description: Camino base
security:
  - tokenDeAcceso: []
tags:
  - name: "Inicio"
    description: "2 opciones del manual"
  - name: "Catastro"
    description: "12 opciones del manual"
  - name: "Rentas · Registro"
    description: "15 opciones del manual"
  - name: "Fiscalización"
    description: "8 opciones del manual"
  - name: "Tránsito"
    description: "23 opciones del manual"
  - name: "Infracciones administrativas"
    description: "13 opciones del manual"
  - name: "Tesorería"
    description: "10 opciones del manual"
  - name: "Consultas"
    description: "11 opciones del manual"
  - name: "Valores"
    description: "6 opciones del manual"
  - name: "Coactiva"
    description: "12 opciones del manual"
  - name: "Autorizaciones y licencias"
    description: "11 opciones del manual"
  - name: "Seguridad"
    description: "11 opciones del manual"
paths:
  "/indicadores/recaudacion":
    get:
      operationId: inicio
      summary: "Panel de recaudación"
      description: "Avance de la recaudación del ejercicio 2026 al 13 de agosto, con la cartera pendiente por tributo y las tareas abiertas de cada unidad."
      tags: ["Inicio"]
      parameters:
        - name: ejercicio
          in: query
          required: false
          schema: { type: string }
          example: "2026"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/portal/deuda":
    get:
      operationId: portal
      summary: "Consulta y pago en línea"
      description: "Flujo público de autoconsulta: el contribuyente identifica su deuda, elige qué pagar y descarga su constancia sin acudir a la municipalidad."
      tags: ["Inicio"]
      parameters:
        - name: doc
          in: query
          required: false
          schema: { type: string }
          example: "44218937"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/urbana/{codRefCatastral}":
    get:
      operationId: ficha_urbana
      summary: "Ficha catastral urbana individual"
      description: "Ficha del predio urbano. El código de referencia catastral se compone de sector, manzana, lote, edificación, entrada, piso y unidad; su cambio obliga a recalcular el autovalúo."
      tags: ["Catastro"]
      parameters:
        - name: codRefCatastral
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/economica/{codRefCatastral}":
    get:
      operationId: ficha_economica
      summary: "Ficha catastral económica"
      description: "Actividad económica que se desarrolla en la unidad catastral, usada para verificar licencias y determinar el uso real del predio."
      tags: ["Catastro"]
      parameters:
        - name: codRefCatastral
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/bienes-comunes/{codEdificacion}":
    get:
      operationId: ficha_bienes
      summary: "Ficha de bienes comunes"
      description: "Áreas comunes de una edificación en régimen de propiedad exclusiva y común, cuyo valor se distribuye entre las unidades según su porcentaje de participación."
      tags: ["Catastro"]
      parameters:
        - name: codEdificacion
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/rural/{codUnidad}":
    get:
      operationId: ficha_rural
      summary: "Ficha catastral rural"
      description: "Predio rústico valorizado por hectárea según el arancel rural, el tipo de tierra y la disponibilidad de riego."
      tags: ["Catastro"]
      parameters:
        - name: codUnidad
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas":
    get:
      operationId: consulta_fichas
      summary: "Consulta de fichas catastrales"
      description: "Búsqueda transversal de fichas por código, titular o ubicación, con el estado de conciliación entre catastro y el padrón de rentas."
      tags: ["Catastro"]
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/fichas/{codigo}/actualizacion":
    put:
      operationId: actualizacion_catastro
      summary: "Actualización del catastro"
      description: "Actualiza construcciones y otras instalaciones de una ficha ya registrada. El sistema conserva cada versión declarada y verificada por piso, con su MEP, ECS, ECC y estado de conservación."
      tags: ["Catastro"]
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/contribuyentes/{codigo}/ficha.pdf":
    get:
      operationId: ficha_contribuyente_reporte
      summary: "Reporte de ficha del contribuyente"
      description: "Ficha impresa del contribuyente: identificación, domicilio fiscal, documentos, contactos y unidades afectas."
      tags: ["Catastro"]
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/vias":
    get:
      operationId: calles
      summary: "Mantenimiento de vías y calles"
      description: "Nomenclatura vial que alimenta el domicilio fiscal y la ubicación del predio. Cada vía guarda su tipo, sector y arancel unitario por tramo."
      tags: ["Catastro"]
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/sectores":
    get:
      operationId: sectores
      summary: "Sectores, manzanas y lotes"
      description: "Estructura territorial sobre la que se arma el código de referencia catastral y se agrupan los padrones por zona."
      tags: ["Catastro"]
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/tablas/aranceles":
    get:
      operationId: aranceles
      summary: "Aranceles de terreno"
      description: "Valor oficial del metro cuadrado de terreno por vía y tramo, publicado anualmente. Es el multiplicador del área de terreno en el autovalúo."
      tags: ["Catastro"]
      parameters:
        - name: anio
          in: query
          required: false
          schema: { type: string }
          example: "2026"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/tablas/valores-unitarios":
    get:
      operationId: valores_unitarios
      summary: "Valores unitarios de edificación"
      description: "Tabla oficial por categoría constructiva. El sistema suma las siete partidas declaradas en la ficha y les aplica la depreciación correspondiente."
      tags: ["Catastro"]
      parameters:
        - name: anio
          in: query
          required: false
          schema: { type: string }
          example: "2026"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/catastro/tablas/depreciacion":
    get:
      operationId: depreciacion
      summary: "Tabla de depreciación"
      description: "Porcentaje que se descuenta del valor de edificación según antigüedad, material predominante (MEP) y estado de conservación (ECS)."
      tags: ["Catastro"]
      parameters:
        - name: anio
          in: query
          required: false
          schema: { type: string }
          example: "2026"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/contribuyentes":
    get:
      operationId: contribuyentes
      summary: "Contribuyentes"
      description: "Padrón único del contribuyente. Su código enlaza predios, vehículos, licencias, papeletas y la cuenta corriente."
      tags: ["Rentas · Registro"]
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/predios":
    get:
      operationId: predios_rentas
      summary: "Predios del contribuyente"
      description: "Padrón predial de rentas. Cada predio guarda su autovalúo, condición de propiedad y la fecha desde la que genera obligación."
      tags: ["Rentas · Registro"]
      parameters:
        - name: contribuyente
          in: query
          required: false
          schema: { type: string }
          example: "codigo"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/predial/calculo-individual":
    post:
      operationId: predial_individual
      summary: "Cálculo individual del impuesto predial"
      description: "Determina el impuesto de un contribuyente sobre el autovalúo acumulado de todos sus predios en el distrito, con la escala progresiva acumulativa y el mínimo imponible de 0.6 % de la UIT."
      tags: ["Rentas · Registro"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/predial/calculo-masivo":
    post:
      operationId: predial_masivo
      summary: "Cálculo masivo del impuesto predial"
      description: "Proceso batch de emisión anual. Recalcula todo el padrón para el ejercicio seleccionado y deja constancia de los contribuyentes observados que quedan fuera de la emisión."
      tags: ["Rentas · Registro"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/declaraciones/{djNro}":
    get:
      operationId: declaracion_jurada
      summary: "Declaración jurada — HR, PU y PR"
      description: "Formularios de la declaración: hoja resumen (HR), predio urbano (PU) y predio rústico (PR). Se imprimen para la firma del contribuyente y quedan como sustento del cálculo."
      tags: ["Rentas · Registro"]
      parameters:
        - name: djNro
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/arbitrios":
    get:
      operationId: arbitrios
      summary: "Arbitrios municipales"
      description: "Limpieza pública, parques y jardines y serenazgo. La tasa depende del uso del predio, la zona, la frecuencia del servicio y los metros de frontis declarados en la ficha."
      tags: ["Rentas · Registro"]
      parameters:
        - name: anio
          in: query
          required: false
          schema: { type: string }
          example: "2026"
      responses:
        200:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/transferencias/predio":
    post:
      operationId: transferencia_predio
      summary: "Transferencia de predio"
      description: "Da de baja al transferente y de alta al adquirente desde la fecha del acto. La obligación del vendedor corre hasta el 31 de diciembre del año de la transferencia."
      tags: ["Rentas · Registro"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/alcabala":
    post:
      operationId: alcabala
      summary: "Impuesto de alcabala"
      description: "Grava la transferencia de propiedad con el 3 % sobre el exceso de las primeras 10 UIT, tomando como base el mayor valor entre el de transferencia y el autovalúo ajustado por el IPM."
      tags: ["Rentas · Registro"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/rentas/vehiculos/{placa}":
    get:
      operationId: vehiculos
      summary: "Ficha de vehículo"
      description: "Registro del vehículo. La afectación corre tres ejercicios desde el año siguiente a la primera inscripción registral."
      tags: ["Rentas · Registro"]
      parameters:
        - name: placa
          in: path
