          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/fiscalizacion/predial/actas":
    post:
      operationId: fisc_predial
      summary: "Fiscalización predial — acta de inspección"
      description: "Formulario de campo optimizado para tablet. Contrasta lo verificado con lo declarado y determina si corresponde emitir resolución de determinación."
      tags: ["Fiscalización"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/fiscalizacion/vehicular":
    post:
      operationId: fisc_vehicular
      summary: "Fiscalización vehicular"
      description: "Cruce del padrón vehicular con la información registral y de SUNAT para detectar vehículos afectos no declarados o con valor subvaluado."
      tags: ["Fiscalización"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        201:
          description: Operacion realizada
          content:
            application/json:
              schema: { type: object }
        "403":
          $ref: "#/components/responses/SinMunicipalidad"
        "422":
          $ref: "#/components/responses/ErrorDeValidacion"
  "/fiscalizacion/resultados":
