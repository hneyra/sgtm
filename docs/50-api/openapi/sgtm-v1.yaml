      description: "Registra una autorización de anuncio y GENERA SU DEUDA por la tasa (RF-114). El cuerpo lleva el titular, el establecimiento asociado —opcional—, la clase y el tipo del elemento, sus medidas, la ubicación, la vigencia y la observación del usuario, obligatoria (RNF-052). El número de la autorización lo pone el sistema desde su correlativo y la tasa sale del conjunto sellado: ninguno de los dos viene en el cuerpo. La cabecera `Idempotency-Key` se lee: reenviar el mismo registro devuelve 200 con la autorización de la primera vez y no genera un segundo cargo."
